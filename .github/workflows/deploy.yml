name: Deploy Liquibase changes to Aiven

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java for Liquibase
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Liquibase executable
        run: chmod +x ./lib/liquibase/liquibase

      - name: Validate Liquibase changelog
        env:
          AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
          AIVEN_DB_USER: ${{ secrets.AIVEN_DB_USER }}
          AIVEN_DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}
        run: |
          LIQUIBASE_URL="$(python -c 'import os,re; from urllib.parse import urlparse; raw=os.environ.get("AIVEN_DB_URL", "").strip(); 
          assert raw, "AIVEN_DB_URL is not set"; 
          m=re.match(r"jdbc:postgresql://([^:/?#]+)(?::(\d+))?/([^?]+)", raw) if raw.startswith("jdbc:postgresql://") else None; 
          host, port, dbname = (m.groups() if m else (urlparse(raw).hostname or "", str(urlparse(raw).port or 5432), urlparse(raw).path.lstrip("/"))); 
          print(f"jdbc:postgresql://{host}:{port}/{dbname}?sslmode=require")')"
          ./lib/liquibase/liquibase \
            --changeLogFile=changelog.xml \
            --url="${LIQUIBASE_URL}" \
            --username="${AIVEN_DB_USER}" \
            --password="${AIVEN_DB_PASSWORD}" \
            validate

      - name: Apply Liquibase updates
        env:
          AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
          AIVEN_DB_USER: ${{ secrets.AIVEN_DB_USER }}
          AIVEN_DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}
        run: |
          LIQUIBASE_URL="$(python -c 'import os,re; from urllib.parse import urlparse; raw=os.environ.get("AIVEN_DB_URL", "").strip(); 
          assert raw, "AIVEN_DB_URL is not set"; 
          m=re.match(r"jdbc:postgresql://([^:/?#]+)(?::(\d+))?/([^?]+)", raw) if raw.startswith("jdbc:postgresql://") else None; 
          host, port, dbname = (m.groups() if m else (urlparse(raw).hostname or "", str(urlparse(raw).port or 5432), urlparse(raw).path.lstrip("/"))); 
          print(f"jdbc:postgresql://{host}:{port}/{dbname}?sslmode=require")')"
          ./lib/liquibase/liquibase \
            --changeLogFile=changelog.xml \
            --url="${LIQUIBASE_URL}" \
            --username="${AIVEN_DB_USER}" \
            --password="${AIVEN_DB_PASSWORD}" \
            update