name: Deploy Liquibase changes to Aiven

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java for Liquibase
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Liquibase executable
        run: chmod +x ./lib/liquibase/liquibase

      - name: Validate Liquibase changelog
        env:
          AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
          AIVEN_DB_USER: ${{ secrets.AIVEN_DB_USER }}
          AIVEN_DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}
        run: |
          LIQUIBASE_URL="$(python - <<'PY'
          import os
          import re
          from urllib.parse import urlparse

          raw = os.environ.get("AIVEN_DB_URL", "").strip()
          if not raw:
              raise ValueError("AIVEN_DB_URL is not set")

          if raw.startswith("jdbc:postgresql://"):
              match = re.match(r"jdbc:postgresql://([^:/?#]+)(?::(\d+))?/([^?]+)", raw)
              if not match:
                  raise ValueError("AIVEN_DB_URL is not a valid JDBC PostgreSQL URL")
              host, port, dbname = match.groups()
          else:
              parsed = urlparse(raw)
              host = parsed.hostname or ""
              port = str(parsed.port or 5432)
              dbname = parsed.path.lstrip("/") or ""
              if not host or not dbname:
                  raise ValueError("AIVEN_DB_URL must contain host and database name")

          print(f"jdbc:postgresql://{host}:{port}/{dbname}?sslmode=require")
          PY
          )"
          echo "Using Liquibase URL: ${LIQUIBASE_URL}"
          ./lib/liquibase/liquibase \
            --changeLogFile=changelog.xml \
            --url="${LIQUIBASE_URL}" \
            --username="${AIVEN_DB_USER}" \
            --password="${AIVEN_DB_PASSWORD}" \
            validate

      - name: Apply Liquibase updates
        env:
          AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
          AIVEN_DB_USER: ${{ secrets.AIVEN_DB_USER }}
          AIVEN_DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}
        run: |
          LIQUIBASE_URL="$(python - <<'PY'
          import os
          import re
          from urllib.parse import urlparse

          raw = os.environ.get("AIVEN_DB_URL", "").strip()
          if not raw:
              raise ValueError("AIVEN_DB_URL is not set")

          if raw.startswith("jdbc:postgresql://"):
              match = re.match(r"jdbc:postgresql://([^:/?#]+)(?::(\d+))?/([^?]+)", raw)
              if not match:
                  raise ValueError("AIVEN_DB_URL is not a valid JDBC PostgreSQL URL")
              host, port, dbname = match.groups()
          else:
              parsed = urlparse(raw)
              host = parsed.hostname or ""
              port = str(parsed.port or 5432)
              dbname = parsed.path.lstrip("/") or ""
              if not host or not dbname:
                  raise ValueError("AIVEN_DB_URL must contain host and database name")

          print(f"jdbc:postgresql://{host}:{port}/{dbname}?sslmode=require")
          PY
          )"
          echo "Using Liquibase URL: ${LIQUIBASE_URL}"
          ./lib/liquibase/liquibase \
            --changeLogFile=changelog.xml \
            --url="${LIQUIBASE_URL}" \
            --username="${AIVEN_DB_USER}" \
            --password="${AIVEN_DB_PASSWORD}" \
            update